name: seal-build

# Build-and-pack only: the test suite runs on Travis (.travis.yml).
on:
  workflow_dispatch: {}

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Resolve devDependencies as of the 1.11.1 release (uglify-js 2.4.13 etc.)
      NPM_CONFIG_REGISTRY: https://:2014-05-01T18%3A05%3A32.863Z@time-machines-npm.sealsecurity.io/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '0.10.48'
      - name: Install faketime
        run: sudo apt-get update && sudo apt-get install -y faketime
      - name: Install dependencies
        run: npm install
      - name: Build (grunt) at the release build time
        # dist/jquery.js embeds the build date and jquery.min.js the build year
        run: FAKETIME_DONT_FAKE_MONOTONIC=1 faketime -f '@2014-05-01 17:42:00' ./node_modules/.bin/grunt
      - name: Generate dist/cdn release copies
        # build/release.js generateArtifacts(): grunt (already run above) + makeReleaseCopies()
        run: |
          npm install shelljs@0.2.6
          node -e 'var R = { newVersion: "1.11.1", preRelease: false, exec: function() {}, define: function( o ) { R.def = o; } }; require( "./build/release.js" )( R ); R.def.generateArtifacts( function( files ) { console.log( "release artifacts: " + files.join( ", " ) ); } );'
          ls -l dist dist/cdn
      - name: Pack
        run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: jquery-npm-tarball
          path: jquery-1.11.1.tgz
          if-no-files-found: error
